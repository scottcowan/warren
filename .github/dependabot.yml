version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        applies-to: version-updates
        patterns: ["*"]
      actions-security:
        applies-to: security-updates
        patterns: ["*"]

  # Single uv workspace lockfile at the repo root covers every package in
  # packages/* (warren-cli, warren-common, warren-mcp, warren-server,
  # warren-sidecar) -- one entry is enough, Dependabot resolves the whole
  # workspace from uv.lock.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      python:
        applies-to: version-updates
        patterns: ["*"]
      python-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: "docker"
    directories:
      - "/images/warren-docker-base"
      - "/images/warren-docker-dev-base"
      - "/images/warren-agent-base"
      - "/images/warren-base-claude-code"
      - "/packages/warren-server"
      - "/packages/warren-server/images/ecs-base"
      - "/packages/warren-server/images/warren-ecs-agent-base"
      - "/packages/warren-server/images/warren-ecs-dev-base"
    schedule:
      interval: "weekly"
    groups:
      docker:
        applies-to: version-updates
        patterns: ["*"]
      docker-security:
        applies-to: security-updates
        patterns: ["*"]
