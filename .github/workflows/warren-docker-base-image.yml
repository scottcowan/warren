name: warren-docker-base image
# Builds and pushes ghcr.io/scottcowan/warren-docker-base (multi-arch amd64+arm64) on version tags.
# NOTE: warren-base-claude-code depends on this image being published before its own build.
# That extension image can be built manually or triggered after this workflow completes.
# Automated chaining is deferred to v1.1.
on:
  push:
    tags: ['warren-docker-base-v*.*.*']
  workflow_call:
    inputs:
      tag:
        description: Release tag to build, e.g. warren-docker-base-v1.2.0
        type: string
        required: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/scottcowan/warren-docker-base
          tags: |
            type=match,pattern=warren-docker-base-v(\d+\.\d+\.\d+),group=1,value=${{ inputs.tag || github.ref_name }}
            type=match,pattern=warren-docker-base-v(\d+\.\d+)\.\d+,group=1,value=${{ inputs.tag || github.ref_name }}
            type=raw,value=latest

      # Base image source: the Dockerfile's default (Docker Hub) first, so a normal release
      # is built exactly as before; falls back to mirror.gcr.io only if Docker Hub fails,
      # after verifying it serves the IDENTICAL digest-pinned manifest. Build content and
      # the base digest in the provenance attestation (default, unchanged) are the same.
      - id: base
        name: Resolve base-image registry
        run: .github/scripts/resolve-base-registry.sh images/warren-docker-base/Dockerfile docker.io/library mirror.gcr.io/library

      - id: build
        continue-on-error: true
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: images/warren-docker-base/Dockerfile
          build-args: BASE_REGISTRY=${{ steps.base.outputs.primary }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Back off before retrying the build
        if: steps.build.outcome == 'failure'
        run: sleep 30

      - name: Retry build from the fallback registry
        if: steps.build.outcome == 'failure'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: images/warren-docker-base/Dockerfile
          build-args: BASE_REGISTRY=${{ steps.base.outputs.fallback }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
