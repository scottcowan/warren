name: warren-ecs-base image
on:
  push:
    tags: ['warren-ecs-base-v*.*.*']
  workflow_call:
    inputs:
      tag:
        description: Release tag to build, e.g. warren-ecs-base-v1.2.0
        type: string
        required: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/scottcowan/warren-ecs-base
          tags: |
            type=match,pattern=warren-ecs-base-v(\d+\.\d+\.\d+),group=1,value=${{ inputs.tag || github.ref_name }}
            type=match,pattern=warren-ecs-base-v(\d+\.\d+)\.\d+,group=1,value=${{ inputs.tag || github.ref_name }}
            type=raw,value=latest

      # Base image source: the Dockerfile's default (ECR Public) first, so a normal release
      # is built exactly as before; only if that registry is unreachable or over its
      # anonymous quota ("toomanyrequests: Data limit exceeded") does it fall back to a
      # registry verified to serve the IDENTICAL digest-pinned manifest. The build content,
      # and the base digest recorded in the provenance attestation (build-push-action's
      # default, unchanged here), are the same whichever registry is used.
      - id: base
        name: Resolve base-image registry
        run: .github/scripts/resolve-base-registry.sh packages/warren-server/images/ecs-base/Dockerfile public.ecr.aws/docker/library mirror.gcr.io/library docker.io/library

      - id: build
        continue-on-error: true
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          # Repo-root context (changed from the image's own dir for UX-1): the
          # Dockerfile now COPYs the shared banner asset from warren-common,
          # same pattern warren-docker-base's own Dockerfile already uses.
          context: .
          file: packages/warren-server/images/ecs-base/Dockerfile
          build-args: BASE_REGISTRY=${{ steps.base.outputs.primary }}
          # amd64 only: Fargate defaults to X86_64 when a task definition's
          # runtimePlatform is unset (confirmed: nothing in runtime/ecs.py or
          # the Terraform/CDK IaC ever sets runtimePlatform/cpuArchitecture),
          # and nothing in this codebase requests ARM64/Graviton. arm64 here
          # bought no real target and made every publish compile under slow
          # QEMU emulation for nothing.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Back off before retrying the build
        if: steps.build.outcome == 'failure'
        run: sleep 30

      - name: Retry build from the fallback registry
        if: steps.build.outcome == 'failure'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: packages/warren-server/images/ecs-base/Dockerfile
          build-args: BASE_REGISTRY=${{ steps.base.outputs.fallback }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
