name: warren-mcp tests

on:
  push:
    paths:
      - 'packages/warren-mcp/**'
      - 'packages/warren-common/**'
      - 'uv.lock'
      - '.github/workflows/warren-mcp-test.yml'
  pull_request:
    paths:
      - 'packages/warren-mcp/**'
      - 'packages/warren-common/**'
      - 'uv.lock'
      - '.github/workflows/warren-mcp-test.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      # warren-common is a workspace member (packages/warren-common), resolved
      # locally — no git/network dependency.
      - name: Install dependencies
        run: uv sync --package warren-mcp --extra dev

      - name: Run test suite
        run: uv run --package warren-mcp pytest packages/warren-mcp/tests -v
