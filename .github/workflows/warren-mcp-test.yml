name: warren-mcp tests

on:
  push:
    paths:
      - 'packages/warren-mcp/**'
      - 'packages/warren-common/**'
      - 'uv.lock'
      - '.github/workflows/warren-mcp-test.yml'
  pull_request:
    paths:
      - 'packages/warren-mcp/**'
      - 'packages/warren-common/**'
      - 'uv.lock'
      - '.github/workflows/warren-mcp-test.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      # warren-common is a workspace member (packages/warren-common), resolved
      # locally — no git/network dependency.
      - name: Install dependencies
        run: uv sync --package warren-mcp --extra dev

      - name: Run test suite
        run: uv run --package warren-mcp pytest packages/warren-mcp/tests -v
