name: warren-ecs-dev-base image
on:
  push:
    tags: ['warren-ecs-dev-base-v*.*.*']
  workflow_call:
    inputs:
      tag:
        description: Release tag to build, e.g. warren-ecs-dev-base-v1.2.0
        type: string
        required: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/scottcowan/warren-ecs-dev-base
          tags: |
            type=match,pattern=warren-ecs-dev-base-v(\d+\.\d+\.\d+),group=1,value=${{ inputs.tag || github.ref_name }}
            type=match,pattern=warren-ecs-dev-base-v(\d+\.\d+)\.\d+,group=1,value=${{ inputs.tag || github.ref_name }}
            type=raw,value=latest

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: packages/warren-server/images/warren-ecs-dev-base
          file: packages/warren-server/images/warren-ecs-dev-base/Dockerfile
          # amd64 only -- see ../warren-ecs-base-image.yml's comment (same
          # reasoning: Fargate defaults to X86_64, nothing requests Graviton).
          # This image in particular compiles Python from source via pyenv, so
          # the arm64 leg was especially slow under QEMU for a target nothing
          # ever uses.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
