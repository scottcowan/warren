name: warren-ecs-dev-base smoke test
# Build-only validation, path-scoped so it only runs when this image's own files
# change — same pattern as devcontainers/images' per-image smoke tests. Publishing
# stays separate, in warren-ecs-dev-base-image.yml, triggered only by a version tag.
#
# Builds ecs-base from this same commit first and passes it in as WARREN_ECS_BASE, so a
# change to ecs-base's Dockerfile is tested with this image too (and this image is tested
# against the ecs-base it will be published on, before that one is published).
on:
  workflow_dispatch:
  pull_request:
    paths:
      - packages/warren-server/images/warren-ecs-dev-base/**
      - packages/warren-server/images/ecs-base/Dockerfile
      - .github/workflows/warren-ecs-dev-base-smoke.yml
  push:
    branches: [main]
    paths:
      - packages/warren-server/images/warren-ecs-dev-base/**
      - packages/warren-server/images/ecs-base/Dockerfile
      - .github/workflows/warren-ecs-dev-base-smoke.yml

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The docker driver builds into the runner's own image store, so the second build's
      # FROM finds the ecs-base the first one loaded (a docker-container builder can't).
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver: docker
      # Same registry fallback as warren-ecs-base-smoke.yml: the digest-pinned bases from
      # a registry verified to serve the identical manifests.
      - id: base
        name: Resolve base-image registry
        run: .github/scripts/resolve-base-registry.sh packages/warren-server/images/ecs-base/Dockerfile mirror.gcr.io/library public.ecr.aws/docker/library docker.io/library
      - name: Build ecs-base from this commit
        env:
          PRIMARY: ${{ steps.base.outputs.primary }}
          FALLBACK: ${{ steps.base.outputs.fallback }}
        run: |
          build() {
            docker buildx build --load -t warren-ecs-base:smoke --build-arg BASE_REGISTRY="$1" \
              -f packages/warren-server/images/ecs-base/Dockerfile .
          }
          build "$PRIMARY" || { sleep 30; build "$FALLBACK"; }
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: packages/warren-server/images/warren-ecs-dev-base
          file: packages/warren-server/images/warren-ecs-dev-base/Dockerfile
          build-args: WARREN_ECS_BASE=warren-ecs-base:smoke
          push: false
          load: true
          tags: warren-ecs-dev-base:smoke

      - name: Sanity-check the built image
        env:
          IMG: warren-ecs-dev-base:smoke
        run: |
          set -eu
          docker run --rm --entrypoint sh "$IMG" -c '. /etc/os-release && test "$ID:$VERSION_CODENAME" = debian:bookworm'
          docker run --rm --entrypoint node "$IMG" --version
          docker run --rm --entrypoint npm "$IMG" --version
          docker run --rm --entrypoint python "$IMG" --version
          docker run --rm --entrypoint python3 "$IMG" --version | grep -q '^Python 3\.12\.'
          docker run --rm --entrypoint uv "$IMG" --version
          docker run --rm --entrypoint aws "$IMG" --version | grep -q '^aws-cli/2\.'
          docker run --rm --entrypoint claude "$IMG" --version
          docker run --rm --entrypoint codex "$IMG" --version | grep -q '^codex-cli '
          docker run --rm --entrypoint pi "$IMG" --version
          # The harnesses run as the workspace user too, and pi's WebAssembly deps load.
          docker run --rm --user 1000:1000 --entrypoint sh "$IMG" -c 'claude --version && codex --version && pi --version'
          docker run --rm --user 1000:1000 -w /opt/pi --entrypoint node "$IMG" -e 'require("@silvia-odwyer/photon-node")'
          # No warren image ships opencode (docs/harnesses.md); self-updates are off.
          docker run --rm --entrypoint sh "$IMG" -c '! command -v opencode'
          docker run --rm --entrypoint sh "$IMG" -c 'test "$DISABLE_AUTOUPDATER$PI_SKIP_VERSION_CHECK" = 11 && grep -qx "check_for_update_on_startup = false" /etc/codex/config.toml'
          # glibc: nodejs.org's node and the glibc Claude Code build.
          docker run --rm --entrypoint sh "$IMG" -c 'ldd "$(command -v node)" | grep -q libc.so.6'
          # ecs-base's contract is unchanged underneath.
          test "$(docker run --rm -e WARREN_APP_CMD='id -u' "$IMG")" = 1000
