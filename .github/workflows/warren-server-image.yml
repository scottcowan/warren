name: warren-server image
on:
  push:
    tags: ['warren-server-v*.*.*']
  workflow_call:
    inputs:
      tag:
        description: Release tag to build, e.g. warren-server-v1.2.0
        type: string
        required: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/scottcowan/warren-server
          tags: |
            type=match,pattern=warren-server-v(\d+\.\d+\.\d+),group=1,value=${{ inputs.tag || github.ref_name }}
            type=match,pattern=warren-server-v(\d+\.\d+)\.\d+,group=1,value=${{ inputs.tag || github.ref_name }}
            type=raw,value=latest

      # warren-common is resolved from the workspace root (packages/warren-common)
      # during `uv lock`/`uv sync` inside the Dockerfile — a local path, no
      # network dependency, unlike the old separate-repo git+https source.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: packages/warren-server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Catches a real gap that shipped silently for a long time: GitManager
      # (warren/git/manager.py) shells out to `git`/`ssh` for every server-side
      # worktree clone, but nothing ever verified either binary was actually in
      # the built image -- unit tests run on a host that already has both, so
      # they never caught it. This loads the just-pushed image fresh (same tag
      # metadata-action just resolved) rather than re-asserting against the
      # local build cache.
      # session-manager-plugin is checked on both platforms: ECSRuntime.exec_stream
      # needs it, and it's a per-arch .deb (QEMU, set up above, runs the arm64 one).
      - name: Sanity-check git/ssh/session-manager-plugin exist in the published image
        run: |
          image="${{ fromJSON(steps.meta.outputs.json).tags[0] }}"
          docker run --rm --entrypoint git "$image" --version
          docker run --rm --entrypoint ssh "$image" -V
          for platform in linux/amd64 linux/arm64; do
            docker run --rm --platform "$platform" --entrypoint session-manager-plugin "$image" --version
          done
