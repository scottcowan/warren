name: framework acceptance (AJ2)

# LangGraph and CrewAI drive warren-server over its control-plane MCP endpoint, on the
# scripted in-memory runtime. The frameworks live in their own uv project
# (examples/frameworks, pinned in its uv.lock): CrewAI pins pydantic<2.13 and an mcp
# version warren-server doesn't, so the server runs from the workspace venv in its
# own process and the frameworks only share HTTP with it.

on:
  push:
    paths:
      - 'examples/frameworks/**'
      - 'packages/warren-server/**'
      - 'packages/warren-common/**'
      - 'uv.lock'
      - '.github/workflows/warren-frameworks-e2e.yml'
  pull_request:
    paths:
      - 'examples/frameworks/**'
      - 'packages/warren-server/**'
      - 'packages/warren-common/**'
      - 'uv.lock'
      - '.github/workflows/warren-frameworks-e2e.yml'

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Install warren-server (workspace venv)
        run: uv sync --package warren-server --extra dev

      # CrewAI's MCP client needs 3.12+ (see examples/frameworks/pyproject.toml).
      - name: Install the frameworks (examples/frameworks venv)
        working-directory: examples/frameworks
        run: uv sync --locked --python 3.12

      - name: Run acceptance tests
        working-directory: examples/frameworks
        run: timeout 600 uv run --locked --python 3.12 pytest -v -m frameworks
