[project]
name = "warren-mcp"
version = "0.1.0"
description = "Local MCP server exposing the warren CLI as tools for an MCP client (Claude Desktop, Claude Code, etc.)"
license = "MIT"
authors = [{ name = "Scott Cowan" }]
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.9,<2",
  "warren",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
]

[project.scripts]
warren-mcp = "warren_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/warren_mcp"]

[tool.uv.sources]
warren = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.urls]
Homepage = "https://github.com/scottcowan/warren"
Source = "https://github.com/scottcowan/warren/tree/main/packages/warren-mcp"
Issues = "https://github.com/scottcowan/warren/issues"
Security = "https://github.com/scottcowan/warren/security/policy"
