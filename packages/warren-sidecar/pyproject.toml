[project]
name = "warren-sidecar"
version = "0.1.0"
description = "In-workspace agent-state recorder for warren workspaces"
license = "MIT"
authors = [{ name = "Scott Cowan" }]
requires-python = ">=3.11"
dependencies = [
  "structlog>=24.4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
]

[project.scripts]
warren-sidecar = "warren_sidecar.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/warren_sidecar"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[project.urls]
Homepage = "https://github.com/scottcowan/warren"
Source = "https://github.com/scottcowan/warren/tree/main/packages/warren-sidecar"
Issues = "https://github.com/scottcowan/warren/issues"
Security = "https://github.com/scottcowan/warren/security/policy"
