[project]
name = "warren-framework-examples"
version = "0.0.0"
description = "AJ2: LangGraph and CrewAI driving warren-server through its control-plane MCP endpoint"
license = "MIT"
# 3.12+: on 3.11 CrewAI 1.15.28's MCP client fails every call with
# "Error during MCP client disconnect: no running event loop".
requires-python = ">=3.12,<3.14"
dependencies = [
  "langgraph==1.2.16",
  "langchain-mcp-adapters==0.3.2",
  "crewai==1.15.28",
  "httpx>=0.28,<0.29",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "pytest-timeout>=2.3",
]

[tool.uv]
package = false
override-dependencies = ["mcp>=1.30,<2", "uv>=0.13.4"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
timeout = 180
testpaths = ["tests"]
markers = [
  "frameworks: AJ2 acceptance tests that need the pinned LangGraph/CrewAI install",
]
